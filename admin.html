<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nude Studio — администратор</title>
<meta name="robots" content="noindex">
<style>
:root { --milk:#fbf7f3; --beige:#efe3d8; --powder:#f2d9d4; --rose:#c98f95; --ink:#3a2f2f; --muted:#8a7a76; }
* { box-sizing: border-box; }
body { margin:0; background:var(--milk); color:var(--ink); font:15px/1.5 system-ui,sans-serif; }
.top { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; background:#fff; border-bottom:1px solid var(--beige); }
.top b { font:20px Georgia,serif; letter-spacing:.06em; }
main { max-width:1100px; margin:auto; padding:24px 16px 60px; }
h2 { font:26px Georgia,serif; margin:34px 0 14px; font-weight:400; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.stat { background:#fff; border-radius:16px; padding:16px; box-shadow:0 4px 16px rgba(120,80,70,.06); }
.stat b { display:block; font:28px Georgia,serif; }
.stat span { color:var(--muted); font-size:13px; }
input,select,button { padding:10px 12px; border:1px solid #dccdc6; border-radius:10px; background:#fff; font:inherit; color:var(--ink); }
button { background:var(--ink); color:#fff; border:0; cursor:pointer; }
button:hover { background:var(--rose); }
.row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.tw { overflow-x:auto; }
table { border-collapse:collapse; width:100%; background:#fff; border-radius:14px; overflow:hidden; }
td,th { padding:10px 12px; border-top:1px solid var(--beige); text-align:left; vertical-align:top; }
th { background:var(--beige); border:0; font-weight:600; }
.err { color:#b3261e; min-height:22px; }
#login { max-width:340px; margin:12vh auto; background:#fff; padding:28px; border-radius:20px; display:grid; gap:12px; }
td input { width:100%; min-width:70px; }
</style>
</head>
<body>
<div id="login" hidden>
  <h2 style="margin:0">Вход</h2>
  <input id="lg" placeholder="Логин" autocomplete="username">
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button id="enter">Войти</button>
</div>

<div id="app" hidden>
  <div class="top"><b>NUDE STUDIO · админка</b><button id="out">Выйти</button></div>
  <main>
    <div class="stats" id="stats"></div>

    <h2>Записи</h2>
    <div class="row">
      <input type="date" id="fd"><select id="fs"><option value="">Все статусы</option></select>
      <input id="fq" placeholder="Имя или телефон"><button id="go">Показать</button><button id="all">Сбросить</button>
    </div>
    <div class="err" id="err"></div>
    <div class="tw"><table><thead><tr><th>Дата</th><th>Время</th><th>Услуга</th><th>Мастер</th><th>Клиент</th><th>Цена</th><th>Статус</th></tr></thead><tbody id="bk"></tbody></table></div>

    <h2>Услуги</h2>
    <p style="color:var(--muted)">Цену и длительность можно менять. Снятая галочка «На сайте» скрывает услугу.</p>
    <div class="tw"><table><thead><tr><th>Название</th><th>Описание</th><th>Цена, ₽</th><th>Мин</th><th>На сайте</th><th></th></tr></thead><tbody id="sv"></tbody></table></div>
    <div class="row" style="margin-top:12px"><input id="nn" placeholder="Новая услуга"><input id="nd" placeholder="Описание"><input id="np" type="number" min="0" placeholder="Цена"><input id="nm" type="number" min="15" placeholder="Мин"><button id="add">Добавить</button></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ST = { pending: 'Ожидает подтверждения', confirmed: 'Подтверждена', arrived: 'Клиент пришёл', done: 'Завершена', cancelled_client: 'Отменена клиентом', cancelled_admin: 'Отменена администратором', no_show: 'Клиент не пришёл' };
async function api(u, body) {
  const o = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'fetch' }, body: JSON.stringify(body) };
  const r = await fetch(u, o);
  const j = await r.json();
  if (r.status === 401 && !u.includes('login')) { show(false); throw Error('Нужен вход'); }
  if (!r.ok) throw Error(j.error || 'Ошибка');
  return j;
}
function show(inside) { $('#login').hidden = inside; $('#app').hidden = !inside; }
$('#fs').innerHTML += Object.entries(ST).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');

async function stats() {
  const s = await api('/api/admin/stats');
  const items = [['Записей на сегодня', s.today], ['Новые заявки', s.pending], ['Подтверждённые', s.confirmed], ['Отмен за месяц', s.cancelled_month],
    ['Выручка за день, ₽', s.revenue_day], ['Выручка за месяц, ₽', s.revenue_month], ['Клиентов', s.clients]];
  $('#stats').innerHTML = items.map(([n, v]) => `<div class="stat"><b>${+v}</b><span>${n}</span></div>`).join('');
}
async function bookings() {
  try {
    const q = new URLSearchParams({ date: $('#fd').value, status: $('#fs').value, q: $('#fq').value });
    const b = await api('/api/admin/bookings?' + q);
    $('#err').textContent = '';
    $('#bk').innerHTML = b.length ? b.map(x => `<tr><td>${esc(x.date)}</td><td>${esc(x.time)}</td><td>${esc(x.service)}</td><td>${esc(x.master)}</td>
      <td>${esc(x.name)}<br>${esc(x.phone)}${x.comment ? '<br><small>' + esc(x.comment) + '</small>' : ''}</td><td>${+x.price}</td>
      <td><select onchange="setStatus(${+x.id},this.value)">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${k === x.status ? 'selected' : ''}>${v}</option>`).join('')}</select></td></tr>`).join('')
      : '<tr><td colspan="7">Записей не найдено.</td></tr>';
  } catch (e) { $('#err').textContent = e.message; }
}
async function setStatus(id, status) {
  try { await api('/api/admin/status', { id, status }); stats(); } catch (e) { $('#err').textContent = e.message; }
  bookings();
}
async function services() {
  const s = await api('/api/admin/services');
  $('#sv').innerHTML = s.map(x => `<tr data-id="${+x.id}"><td><input value="${esc(x.name)}"></td><td><input value="${esc(x.descr)}"></td>
    <td><input type="number" min="0" value="${+x.price}"></td><td><input type="number" min="15" value="${+x.dur}"></td>
    <td><input type="checkbox" ${x.active ? 'checked' : ''}></td><td><button>Сохранить</button></td></tr>`).join('');
  $('#sv').querySelectorAll('tr').forEach(tr => tr.querySelector('button').onclick = async () => {
    const i = tr.querySelectorAll('input');
    try { await api('/api/admin/service', { id: +tr.dataset.id, name: i[0].value, descr: i[1].value, price: +i[2].value, dur: +i[3].value, active: i[4].checked ? 1 : 0 }); $('#err').textContent = 'Сохранено'; }
    catch (e) { $('#err').textContent = e.message; }
  });
}
$('#add').onclick = async () => {
  try { await api('/api/admin/service', { name: $('#nn').value, descr: $('#nd').value, price: +$('#np').value, dur: +$('#nm').value, active: 1 }); ['nn', 'nd', 'np', 'nm'].forEach(i => $('#' + i).value = ''); services(); }
  catch (e) { $('#err').textContent = e.message; }
};
$('#go').onclick = bookings;
$('#all').onclick = () => { $('#fd').value = ''; $('#fs').value = ''; $('#fq').value = ''; bookings(); };
$('#enter').onclick = async () => {
  try { await api('/api/admin/login', { login: $('#lg').value, password: $('#pw').value }); $('#pw').value = ''; start(); }
  catch (e) { $('#lerr').textContent = e.message; }
};
$('#out').onclick = async () => { await api('/api/admin/logout', {}); show(false); };
async function start() { show(true); try { await Promise.all([stats(), bookings(), services()]); } catch (e) {} }
fetch('/api/admin/me').then(r => r.ok ? start() : show(false));
</script>
</body>
</html>
